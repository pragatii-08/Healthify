<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doctor Sign Up | Healthify</title>
<link rel="icon" type="image/png" href="logo.png">

<link rel="stylesheet" href="css/bootstrap.min.css">
<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: black;
    color: white;
}

#particles-js {
    position: fixed;
    width: 100%;
    height: 100%;
    z-index: -1;
}

.form-box {
    background: rgba(0,0,0,0.9);
    border-radius: 12px;
    padding: 25px;
    box-shadow: 0 0 20px rgba(255,255,255,0.2);
}

/* Inputs */
.form-control {
    background: black !important;
    color: white !important;
    border: 1px solid #888;
}

.form-control:focus {
    background: black;
    color: white;
    border-color: white;
    box-shadow: none;
}

label {
    font-weight: 500;
    margin-bottom: 5px;
}

/* Radio buttons styling */
.form-check-input {
    background-color: black;
    border: 1px solid white;
}

.form-check-input:checked {
    background-color: white;
    border-color: white;
}

.form-check-label {
    margin-left: 5px;
}
</style>
</head>

<body>

<div id="particles-js"></div>

<div class="container mt-5">
<div class="row justify-content-center">
<div class="col-md-6 form-box">

<div class="text-center mb-3">
  <img src="logo.png" width="55" height="55" class="rounded-circle" alt="Healthify Logo">
</div>
<h3 class="text-center mb-4">Doctor Registration</h3>

<form onsubmit="doctorSignup(event)">

    <!-- Full Name -->
    <label>Full Name</label>
    <input type="text" id="name" class="form-control mb-3" required>

    <!-- Age -->
    <label>Age</label>
    <input type="number" id="age" class="form-control mb-3" required>

    <!-- Gender Radio -->
    <label>Gender</label>
    <div class="mb-3">
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="gender" id="male" value="male" required>
            <label class="form-check-label" for="male">Male</label>
        </div>

        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="gender" id="female" value="female">
            <label class="form-check-label" for="female">Female</label>
        </div>

    </div>

    <!-- Contact -->
    <label>Mobile Number</label>
    <input type="text" id="contact" class="form-control mb-3" required>

    <!-- Email -->
    <label>Email Address</label>
    <input type="email" id="email" class="form-control mb-3" required>

    <!-- Experience -->
    <label>Years of Experience</label>
    <input type="text" id="experience" class="form-control mb-3" required>

    <!-- Expertise -->
    <label>Area of Expertise</label>
    <input type="text" id="expertise" class="form-control mb-3" required>

    <!-- Registration Number -->
    <label>Medical Registration Number</label>
    <input type="text" id="regNo" class="form-control mb-3" required>

    <!-- State Council -->
    <label>State Medical Council</label>
    <input type="text" id="stateCouncil" class="form-control mb-3" required>

    <button class="btn btn-light w-100 mt-2">Submit</button>

</form>

</div>
</div>
</div>

<!-- PARTICLES -->
<script>
particlesJS("particles-js", {
  particles: {
    number: { value: 90, density: { enable: true, value_area: 900 } },
    color: { value: "#ffffff" },
    shape: { type: "circle" },
    opacity: { value: 0.6 },
    size: { value: 3, random: true },
    line_linked: {
      enable: true,
      distance: 150,
      color: "#ffffff",
      opacity: 0.4,
      width: 1
    },
    move: { enable: true, speed: 2 }
  },
  retina_detect: true
});
</script>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, addDoc, collection } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAYzmBXm6U3Mwrq1vXCBk9Nlt85ydVGQpc",
  authDomain: "healtify-cd401.firebaseapp.com",
  projectId: "healtify-cd401"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.doctorSignup = async function(event) {
    event.preventDefault();

    try {
        const genderEl = document.querySelector('input[name="gender"]:checked');
        const gender = genderEl ? genderEl.value : 'unspecified';

        await addDoc(collection(db, "newdoctor"), {
            name: document.getElementById("name").value,
            age: document.getElementById("age").value,
            gender: gender,
            contact: document.getElementById("contact").value,
            email: document.getElementById("email").value,
            experience: document.getElementById("experience").value,
            expertise: document.getElementById("expertise").value,
            regNo: document.getElementById("regNo").value,
            stateCouncil: document.getElementById("stateCouncil").value,
            createdAt: Date.now()
        });
    } catch (err) {
        console.warn("Firestore registration submission fallback:", err);
    }

    alert("Registration submitted successfully! Your doctor account application has been received.");
    document.querySelector("form").reset();
}

</script>

</body>
</html>
