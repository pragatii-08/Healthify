    border: none;

}

    box-shadow: none;
}

.btn-login {
    background-color: #198754;
    border: none;
}

a {
    color: #8ab4f8;

<body>

<div id="particles-js"></div>

</div>

</div>
</div>

<!-- LOGIN SCRIPT -->
<script>
function login() {
    const rawUserId = document.getElementById("userid").value;
    const rawPassword = document.getElementById("password").value;
    const error = document.getElementById("error");

    if (!rawUserId || !rawPassword) {
        error.innerText = "Please enter email & password!";
        return;
    }

    const userId = rawUserId.trim().toLowerCase();
    const password = rawPassword.trim();
    error.innerText = "";

    // 1. Admin login
    if (userId === "admin@gmail.com" && password === "123") {
        alert("Admin Login Successful!");
        window.location.href = "admin-pg.html";
        return;
    }

    // 2. Doctor login (check known doctor accounts or doctor password)
    const doctorEmails = [
        "ananya.roy@healthify.com",
        "rajesh.mehta@healthify.com",
        "sunita.rao@healthify.com",
        "vikram.joshi@healthify.com",
        "kavita.nair@healthify.com",
        "suresh.kumar@gmail.com",
        "meera.iyer@gmail.com",
        "rohan.gupta@gmail.com",
        "neha.sharma@gmail.com",
        "alok.pandey@gmail.com"
    ];

    if (doctorEmails.includes(userId) || password === "Doctor@1234" || userId.includes("healthify")) {
        alert("Doctor Login Successful!");
        window.location.href = "doctor-pg.html";
        return;
    }

    // 3. Lab login (check known lab accounts or lab password)
    const labEmails = [
        "contact@metropolislab.com",
        "info@thyrocarelab.com",
        "support@lalpathlabs.com",
        "care@srl.com",
        "help@suburbandiagnostics.com",
        "info@apexlab.com",
        "support@carevision.com",
        "admin@healthchecklab.com",
        "contact@precisionlab.com",
        "service@lifecarelab.com"
    ];

    if (labEmails.includes(userId) || password === "Lab@1234" || userId.includes("lab")) {
        alert("Lab Login Successful!");
        window.location.href = "lab-pg.html";
        return;
    }

    // 4. Try Firebase query for registered users
    try {
        db.collection("users")
        .where("email", "==", userId)
        .where("password", "==", password)
        .get()
        .then(snapshot => {
            if (!snapshot.empty) {
                alert("Login Successful!");
                window.location.href = "mainweb-pg.html";
            } else {
                // Fallback for user logins
                alert("Login Successful!");
                window.location.href = "mainweb-pg.html";
            }
        })
        .catch(() => {
            // Local fallback for users if Firebase is unreachable
            alert("Login Successful!");
            window.location.href = "mainweb-pg.html";
        });
    } catch (e) {
        alert("Login Successful!");
        window.location.href = "mainweb-pg.html";
    }
}
</script>
